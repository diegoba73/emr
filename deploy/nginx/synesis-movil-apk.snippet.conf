# APK móvil — URL fija pública:
#   https://emr.icpueblodeluis.com.ar:8080/synesis-movil.apk
#
# IMPORTANTE: el archivo debe vivir FUERA del filesystem efímero del
# contenedor. Si se publica solo con `docker cp …:/usr/share/nginx/html/…`,
# al regenerar/redeployar nginx el APK desaparece y el QR “deja de funcionar”.
#
# Persistencia (obligatoria en prod):
#   Host:  /srv/emr/public/synesis-movil.apk
#   Mount: /srv/emr/public:/srv/emr/public:ro  (servicio nginx del compose)
#
# Incluir este bloque dentro del `server { … }` HTTPS/HTTP que atiende el
# dominio clínico (mismo que sirve el frontend/API).

location = /synesis-movil.apk {
    alias /srv/emr/public/synesis-movil.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="synesis-movil.apk"';
    add_header Cache-Control "no-cache";
}
