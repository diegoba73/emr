# Incluir dentro del server HTTPS que escucha en :8080 (emr.icpueblodeluis.com.ar).
# Archivo en disco: /srv/emr/public/synesis-movil.apk
#
# location = /synesis-movil.apk {
#     alias /srv/emr/public/synesis-movil.apk;
#     default_type application/vnd.android.package-archive;
#     add_header Content-Disposition 'attachment; filename="synesis-movil.apk"';
#     add_header Cache-Control "no-cache";
# }

location = /synesis-movil.apk {
    alias /srv/emr/public/synesis-movil.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="synesis-movil.apk"';
    add_header Cache-Control "no-cache";
}
