# Incluir dentro del server HTTPS que atiende emr.icpueblodeluis.com.ar:8080.
#
# Opción A — archivo en el filesystem del host montado en el contenedor:
#   Host: /srv/emr/public/synesis-movil.apk
#   Mount sugerido: /srv/emr/public:/srv/emr/public:ro
#
# location = /synesis-movil.apk {
#     alias /srv/emr/public/synesis-movil.apk;
#     default_type application/vnd.android.package-archive;
#     add_header Content-Disposition 'attachment; filename="synesis-movil.apk"';
#     add_header Cache-Control "no-cache";
# }
#
# Opción B — archivo dentro de la imagen/html del nginx (docker cp):
#   docker cp synesis-movil.apk emr_nginx_server:/usr/share/nginx/html/synesis-movil.apk

location = /synesis-movil.apk {
    root /usr/share/nginx/html;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="synesis-movil.apk"';
    add_header Cache-Control "no-cache";
}
