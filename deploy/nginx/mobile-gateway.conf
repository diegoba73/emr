server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;

    location /api/movil/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mobile_backend backend:8000;
        proxy_pass http://$mobile_backend;
        proxy_set_header Host emr.sytes.net;
        proxy_set_header X-Forwarded-Host emr.sytes.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        # Do not trust client-supplied forwarding headers for authentication throttles.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @unavailable;
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"detail":"Servicio temporalmente no disponible."}';
    }

    location / { return 404; }
}
