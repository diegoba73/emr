# Nginx clínico EMR/LIMS — SPA React + proxy API + APK móvil persistente.
# Montar en el host: /srv/emr/public:/srv/emr/public:ro (servicio nginx).

upstream emr_django {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # APK pacientes — ANTES del catch-all SPA (si no, el QR “abre” el login HTML).
    # Archivo en disco del host, no dentro del contenedor.
    location = /synesis-movil.apk {
        alias /srv/emr/public/synesis-movil.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="synesis-movil.apk"';
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://emr_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://emr_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        deny all;
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
