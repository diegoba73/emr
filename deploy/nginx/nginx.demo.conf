# Nginx del stack DEMO — SPA + API.
# Build con PUBLIC_URL=/showcase y REACT_APP_API_URL=/showcase-api.
# Acceso directo :8081 → http://localhost:8081/showcase/demo
# Proxy clínico :8080/showcase/ → este mismo upstream (BD demo, no clínica).

upstream demo_django {
    server backend:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Atajos → entrada demo con basename /showcase
    location = / {
        return 302 /showcase/demo;
    }
    location = /demo {
        return 302 /showcase/demo;
    }

    # API bajo prefijo showcase (local :8081 y mismo path vía clínico)
    location /showcase-api/ {
        proxy_pass http://demo_django/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Compat: /api/ directo (p. ej. health checks viejos)
    location /api/ {
        proxy_pass http://demo_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://demo_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        deny all;
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # CRA emite /showcase/static/... pero los archivos viven en /static/...
    location /showcase/ {
        rewrite ^/showcase/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Fallback SPA sin prefijo (por si el proxy clínico strippea /showcase/)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
