# Add to the existing server Compose project. Only this service needs starting.
services:
  mobile_gateway:
    image: emr_server-nginx
    container_name: emr_mobile_gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:80"
    volumes:
      - ./deploy/nginx/mobile-gateway.conf:/etc/nginx/conf.d/default.conf:ro
